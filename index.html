<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>語音轉文字</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>語音轉文字</h1>
    <p class="sub">按下麥克風開始說話，文字會即時出現</p>
  </header>

  <main>
    <div id="unsupported" class="notice error" hidden>
      這個瀏覽器不支援語音辨識。請改用 <b>Chrome</b>、<b>Edge</b>（電腦或 Android），或 iPhone／iPad 上的 <b>Safari</b>。
    </div>

    <section class="controls">
      <button id="micBtn" class="mic" aria-pressed="false" aria-label="開始錄音">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="status" id="status">尚未開始</div>

      <div class="options">
        <label>語言
          <select id="lang">
            <option value="zh-TW" selected>中文（台灣）</option>
            <option value="en-US">English (US)</option>
            <option value="ja-JP">日本語</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="autoPunct" checked> 句尾自動加「，」</label>
        <label class="check"><input type="checkbox" id="newLine"> 每句換行</label>
        <label class="check"><input type="checkbox" id="timestamp"> 加上時間</label>
      </div>
    </section>

    <section class="transcript">
      <div class="bar">
        <h2>文字內容 <span class="hint">（可直接修改）</span></h2>
        <span id="count" class="count">0 字</span>
      </div>
      <div id="interim" class="interim" aria-live="polite"></div>
      <textarea id="text" placeholder="辨識出的文字會出現在這裡…"></textarea>

      <div class="actions">
        <button id="copyBtn">複製</button>
        <button id="downloadBtn">下載 .txt</button>
        <button id="saveBtn">存成一筆紀錄</button>
        <button id="clearBtn" class="danger">清除</button>
      </div>
    </section>

    <details class="panel">
      <summary>自訂詞彙修正（專有名詞常被聽錯時使用）</summary>
      <p class="hint">每行一筆，格式：<code>聽錯的字=正確的字</code>。辨識完成後會自動替換。</p>
      <textarea id="fixes" rows="6" placeholder="例如：&#10;壓根管=根管&#10;牙周北=牙周病&#10;植牙體=植體"></textarea>
    </details>

    <details class="panel" id="historyPanel">
      <summary>已存紀錄（<span id="historyCount">0</span>）</summary>
      <ul id="history"></ul>
    </details>

    <p class="footnote">
      紀錄只存在這台裝置的瀏覽器裡，不會上傳到任何伺服器。<br>
      注意：Chrome／Edge 的語音辨識會把聲音送到 Google／Microsoft 的伺服器處理，請避免唸出病人的身分證號等敏感資料。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
